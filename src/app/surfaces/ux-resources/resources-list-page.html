<section class="resources-list" aria-labelledby="resources-list-title">
  <header class="resources-list__page-header">
    <div class="resources-list__titles">
      <span class="app-page-context">Contexto · Recursos</span>
      <h1 id="resources-list-title" class="resources-list__title">Recursos</h1>
      <p class="resources-list__caption">
        Consulte os recursos reserváveis e quantas reservas futuras cada um tem.
      </p>
    </div>
  </header>

  <div class="resources-list__toolbar">
    <mat-form-field
      appearance="outline"
      class="resources-list__search"
      subscriptSizing="dynamic"
    >
      <input
        matInput
        type="search"
        name="resources-search"
        placeholder="Buscar…"
        aria-label="Buscar"
        autocomplete="off"
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchInput($event)"
      />
    </mat-form-field>

    @if (canWrite()) {
      <button
        mat-flat-button
        color="primary"
        type="button"
        class="resources-list__cta"
        (click)="onCreate()"
      >
        Novo recurso
      </button>
    }
  </div>

  @if (bannerKind(); as kind) {
    <app-alert-banner [kind]="kind" [message]="bannerMessage()" />
  }

  @if (actionError()) {
    <app-alert-banner kind="refusal" [message]="actionError()" />
  }

  @if (loading()) {
    <app-skeleton-block label="Carregando recursos…" [lines]="5" />
  } @else if (showEmpty()) {
    <app-empty-state
      title="Nenhum recurso cadastrado ainda."
      [message]="
        canWrite()
          ? 'Use o botão Novo recurso para cadastrar o primeiro.'
          : 'Os recursos cadastrados aparecerão aqui.'
      "
    />
  } @else if (showNoSearchResults()) {
    <app-empty-state
      title="Nenhum resultado para a busca."
      message="Ajuste o termo ou limpe a busca para ver todos os recursos."
    />
  } @else if (showTable()) {
    <app-responsive-data-table
      [columns]="columns"
      [rows]="filteredRows()"
      [showOpen]="true"
      [showEdit]="canWrite()"
      [showDelete]="canWrite()"
      (openRow)="onOpenRow($event)"
      (editRow)="onEditRow($event)"
      (deleteRow)="onDeleteRow($event)"
    />
  }
</section>
