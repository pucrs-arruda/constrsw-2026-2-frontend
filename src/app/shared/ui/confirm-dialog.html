<h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>

<mat-dialog-content class="confirm-dialog__content">
  <p class="confirm-dialog__message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions
  class="confirm-dialog__actions"
  [class.confirm-dialog__actions--stack]="isCompact()"
  align="end"
>
  <button
    type="button"
    mat-button
    class="confirm-dialog__btn"
    (click)="cancel()"
  >
    {{ cancelLabel }}
  </button>
  <button
    type="button"
    mat-flat-button
    color="primary"
    class="confirm-dialog__btn"
    (click)="confirm()"
  >
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
