server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Em localhost o navegador manda os cookies de todos os projetos da máquina (cookie não separa
    # porta). Somados ao cookie de sessão do oauth (~3 KB), passam do limite padrão de 8 KB por
    # linha de cabeçalho e o nginx responde 400 a tudo depois do login — inclusive aos chunks
    # carregados sob demanda, como a tela de salas.
    large_client_header_buffers 4 32k;

    # Compose healthcheck — not a BFF /health screen
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Same-origin oauth (Story 0.2). Upstream port = OAUTH_INTERNAL_API_PORT (lab default 8088).
    location /oauth/ {
        proxy_pass http://oauth:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Same-origin BFF. Upstream port = BFF_INTERNAL_API_PORT (lab default 3001); container name `api`.
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Ao BFF vai só o cookie de sessão do sistema. Cookies de outros projetos em localhost
        # estouravam o limite de cabeçalho do Node (431). Cookie vazio = sem sessão (bearer-token.ts).
        proxy_set_header Cookie "closed_cras_session=$cookie_closed_cras_session";
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
