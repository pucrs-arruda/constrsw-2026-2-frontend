server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck — not a BFF /health screen
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
