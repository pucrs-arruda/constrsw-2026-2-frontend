server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck — not a BFF /health screen
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Same-origin oauth (Story 0.2). Upstream port = OAUTH_INTERNAL_API_PORT (lab default 8088).
    location /oauth/ {
        proxy_pass http://oauth:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Same-origin BFF. Upstream port = BFF_INTERNAL_API_PORT (lab default 3001); container name `api`.
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
